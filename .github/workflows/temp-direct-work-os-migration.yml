name: Temporary direct Work OS repository migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-subtree:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target main
        uses: actions/checkout@v4
        with:
          ref: main
          path: target
          token: ${{ github.token }}

      - name: Check out source private repository
        uses: actions/checkout@v4
        with:
          repository: Tanukitsune-hub/context-hub
          ref: main
          path: source
          token: ${{ github.token }}
          sparse-checkout: |
            projects/google-workspace-personal-work-os
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Copy and verify exact subtree
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/source/projects/google-workspace-personal-work-os"
          target_dir="$GITHUB_WORKSPACE/target"
          test -d "$source_dir"

          find "$source_dir" -type f -printf '%P\0' | sort -z | while IFS= read -r -d '' path; do
            sha256sum "$source_dir/$path"
          done > /tmp/source.sha256

          rsync -a --delete --exclude='.git/' "$source_dir/" "$target_dir/"

          find "$target_dir" -path "$target_dir/.git" -prune -o -type f -printf '%P\0' | sort -z | while IFS= read -r -d '' path; do
            sha256sum "$target_dir/$path"
          done > /tmp/target.sha256

          sed "s#  $source_dir/#  #" /tmp/source.sha256 > /tmp/source.normalized
          sed "s#  $target_dir/#  #" /tmp/target.sha256 > /tmp/target.normalized
          diff -u /tmp/source.normalized /tmp/target.normalized

          echo "Migrated file count: $(wc -l < /tmp/source.normalized)"

      - name: Commit exact migrated tree to target main
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: migrate Google Workspace Work OS project"
          git push origin HEAD:main
